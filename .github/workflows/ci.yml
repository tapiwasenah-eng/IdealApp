name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci --legacy-peer-deps
      
    - name: Run linter
      run: npm run lint
      
    - name: Run build
      run: npm run build
      env:
        # Prevent types and build checks from failing if variables are strictly required by Vite,
        # but mock them for CI if needed. Usually, Vite build allows undefined env vars unless specifically guarded.
        VITE_PAYPAL_CLIENT_ID: mock-client-id
